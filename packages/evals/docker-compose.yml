# Build the web and runner images:
# docker compose build web runner
#
# Start all "server" services (db, redis, web):
# docker compose --profile server up
#
# Start a shell in the runner container:
# docker compose run --rm runner bash
#
# Or using the docker cli:
# docker run -it --rm --network evals_default evals-runner bash
#
# To enable docker execution, run:
# docker run -it --rm --network evals_default -e DOCKER_HOST=tcp://docker-proxy:2375 -e HOST_EXECUTION_METHOD=docker evals-runner bash

services:
    db:
        container_name: evals-db
        image: postgres:15.4
        ports:
            - "127.0.0.1:${EVALS_DB_PORT:-5432}:5432"
        volumes:
            - ./.docker/postgres:/var/lib/postgresql/data
            - ./.docker/scripts/postgres:/docker-entrypoint-initdb.d
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=password
            - POSTGRES_DATABASES=evals_development,evals_test
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d evals_development"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 30s
        profiles:
            - server

    redis:
        container_name: evals-redis
        image: redis:7-alpine
        ports:
            - "127.0.0.1:${EVALS_REDIS_PORT:-6379}:6379"
        volumes:
            - ./.docker/redis:/data
        command: redis-server --appendonly yes
        profiles:
            - server

    docker-proxy:
        container_name: evals-docker-proxy
        build:
            context: ../../
            dockerfile: packages/evals/Dockerfile.proxy
        environment:
            - DOCKER_ENDPOINT=unix:///var/run/docker.sock
            - PROXY_PORT=2375
            # REQUIRED: set this in your .env or deployment environment.
            # Compose will fail with an error if PROXY_AUTH_TOKEN is not set.
            - PROXY_AUTH_TOKEN=${PROXY_AUTH_TOKEN:?PROXY_AUTH_TOKEN must be set}
        volumes:
            # Note: :ro only restricts filesystem writes, not Docker API write operations.
            # The proxy policy engine is the sole defense for API-level write control.
            - /var/run/docker.sock:/var/run/docker.sock
        networks:
            - default
        profiles:
            - server
            - runner

    web:
        container_name: evals-web
        build:
            context: ../../
            dockerfile: packages/evals/Dockerfile.web
        ports:
            - "127.0.0.1:${EVALS_WEB_PORT:-3446}:3446"
        environment:
            - HOST_EXECUTION_METHOD=docker
            - DOCKER_HOST=tcp://docker-proxy:2375
            # Same auth token used to authenticate against the Docker proxy
            - PROXY_AUTH_TOKEN=${PROXY_AUTH_TOKEN}
            - PRODUCTION_DATABASE_URL
            - EVALS_ADMIN_SECRET
        volumes:
            # Mount log files so web can access task logs
            - /tmp/evals:/tmp/evals:ro
        depends_on:
            db:
                condition: service_healthy
            docker-proxy:
                condition: service_started
        profiles:
            - server

    runner:
        container_name: evals-runner
        build:
            context: ../../
            dockerfile: packages/evals/Dockerfile.runner
        environment:
            - HOST_EXECUTION_METHOD=docker
            - DOCKER_HOST=tcp://docker-proxy:2375
            # Same auth token used to authenticate against the Docker proxy
            - PROXY_AUTH_TOKEN=${PROXY_AUTH_TOKEN}
        volumes:
            - /tmp/evals:/var/log/evals
        stdin_open: true
        tty: true
        depends_on:
            docker-proxy:
                condition: service_started
        profiles:
            - runner

networks:
    default:
        name: evals_default
        driver: bridge
