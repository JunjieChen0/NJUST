name: Code QA NJUST_AI

on:
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:
        types: [opened, reopened, ready_for_review, synchronize]
        branches: [main]

permissions:
    contents: read

jobs:
    check-translations:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Verify all translations are complete
              run: node scripts/find-missing-translations.js

    knip:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Run knip checks
              run: pnpm knip

    repository-hygiene:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Check repository hygiene and dependency policy seed
              run: pnpm syncpack:lint
            - name: Verify generated extension settings schema is current
              run: pnpm check:settings-schema

    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Lint
              run: pnpm lint

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Check types
              run: pnpm check-types

    unit-test:
        name: platform-unit-test (${{ matrix.name }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      name: ubuntu-latest
                    - os: windows-latest
                      name: windows-latest
                    - os: macos-latest
                      name: macos-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Build types package
              run: pnpm --filter @njust-ai/types build
            - name: Run unit tests
              run: pnpm test
              env:
                NODE_OPTIONS: "--max-old-space-size=4096"

    e2e-test:
        name: e2e-test (VS Code ${{ matrix.vscode }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # Current stable plus the lower bound declared in engines.vscode.
                vscode: ["1.144.0", "1.95.3"]
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Cache VS Code test build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: apps/vscode-e2e/.vscode-test
                  key: vscode-test-${{ runner.os }}-${{ matrix.vscode }}
            - name: Build types package
              run: pnpm --filter @njust-ai/types build
            - name: Run E2E tests
              run: xvfb-run -a pnpm --filter @njust-ai/vscode-e2e test:ci
              env:
                  VSCODE_VERSION: ${{ matrix.vscode }}

    coverage:
        name: coverage (${{ matrix.name }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: src
                      command: pnpm test:coverage
                      files: ./coverage/src/coverage-final.json
                      flags: src
                    - name: prompt-engine
                      command: pnpm --filter @njust-ai/prompt-engine test:coverage
                      files: ./coverage/prompt-engine/coverage-final.json
                      flags: prompt-engine
                    - name: webview-ui
                      command: pnpm --filter @njust-ai/vscode-webview test:coverage
                      files: ./coverage/webview-ui/coverage-final.json
                      flags: webview-ui
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
              with:
                fetch-depth: 0 # 获取完整历史用于 PR 比较
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Build types package
              run: pnpm --filter @njust-ai/types build
            - name: Run ${{ matrix.name }} tests with coverage
              run: ${{ matrix.command }}
              env:
                NODE_OPTIONS: "--max-old-space-size=4096"
            - name: Upload ${{ matrix.name }} coverage to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                token: ${{ secrets.CODECOV_TOKEN }}
                files: ${{ matrix.files }}
                flags: ${{ matrix.flags }}
                fail_ci_if_error: false
                verbose: true

    check-secrets:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Scan for secrets
              run: node scripts/check-secrets.mjs --all-files

    circular-deps:
        name: circular-dependency-guard
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Check for circular dependencies between critical modules
              run: pnpm check:circular

    unsafe-any-gate:
        name: unsafe-any-gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Verify UnsafeAny / cast counts have not grown
              run: pnpm check:any-gate
            - name: Verify oversized production files have not grown
              run: pnpm check:file-size
            - name: Verify pnpm.overrides policy is respected
              run: pnpm check:overrides

    bundle-size:
        name: bundle-size-check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Build extension bundle (turbo handles deps)
              run: pnpm bundle
            - name: Check bundle size
              run: pnpm check:bundle-size

    inheritance-health:
        name: inheritance-health-check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Check inheritance health
              run: pnpm check:inheritance
